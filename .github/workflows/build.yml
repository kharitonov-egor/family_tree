name: Build and test
on:
  push:
    paths-ignore: ['docs/metrics/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {loader: fabric, minecraft: '1.21.1'}
          - {loader: fabric, minecraft: '26.1.1'}
          - {loader: fabric, minecraft: '26.1.2'}
          - {loader: fabric, minecraft: '26.2'}
          - {loader: fabric, minecraft: '26.3'}
          - {loader: neoforge, minecraft: '1.21.1'}
          - {loader: neoforge, minecraft: '26.2'}
          - {loader: neoforge, minecraft: '26.3'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: chmod +x gradlew
      - if: matrix.loader == 'fabric'
        run: ./gradlew :${{ matrix.minecraft }}:build --console=plain --no-parallel
      - if: matrix.loader == 'neoforge'
        run: ./gradlew -p neoforge build -Pminecraft=${{ matrix.minecraft }} --console=plain --no-parallel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: familytree-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            versions/${{ matrix.minecraft }}/build/test-results/test/*.xml
            neoforge/build/${{ matrix.minecraft }}/libs/*.jar
            neoforge/build/${{ matrix.minecraft }}/test-results/test/*.xml
