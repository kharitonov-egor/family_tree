plugins {
    id 'dev.kikugie.loom-back-compat'
    id 'java'
}

if (project.hasProperty('smoke')) {
    sourceSets {
        smoke {
            java.setSrcDirs([rootProject.file('src/smoke/java')])
            resources.setSrcDirs([rootProject.file('src/smoke/resources')])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods { familytree_smoke { sourceSet sourceSets.smoke } }
        runs {
            smoke {
                server()
                source sourceSets.smoke
                runDir "../../build/smoke-${stonecutter.current.version}"
                programArgs 'nogui'
                vmArg "-Dfamilytree.smoke.minimumHistory=${project.findProperty('smokeHistory') ?: '0'}"
            }
        }
    }
    tasks.named('runSmoke') {
        def result = rootProject.file("build/smoke-${stonecutter.current.version}/smoke-result.txt")
        doFirst { result.delete() }
        doLast {
            if (!result.exists() || !result.text.startsWith('PASS:'))
                throw new GradleException(result.exists() ? result.text : 'Smoke test did not report a result')
        }
    }
}

def mcVersion = stonecutter.current.version

def fabricApiVersions = [
        '1.20.1': '0.92.12+1.20.1',
        '1.21.1': '0.116.17+1.21.1',
        '1.21.4': '0.119.4+1.21.4',
        '1.21.5': '0.128.2+1.21.5',
        '1.21.8': '0.136.1+1.21.8',
        '1.21.10': '0.138.4+1.21.10',
        '1.21.11': '0.141.6+1.21.11',
        '26.1.1': '0.145.4+26.1.1',
        '26.1.2': '0.155.3+26.1.2',
        '26.2'  : '0.154.1+26.2',
        '26.3'  : '0.161.0+26.3',
]
def fabricApiVersion = fabricApiVersions[mcVersion]
if (fabricApiVersion == null) {
    throw new GradleException("No Fabric API version mapped for Minecraft ${mcVersion} — add it to build.gradle")
}
// The 1.21.8 and 1.21.10 jars also declare earlier patches they ran on. ALSO_RUNS_ON in release_manifest.py must match.
def minecraftRanges = ['1.21.8': '>=1.21.6 <=1.21.8', '1.21.10': '>=1.21.9 <=1.21.10']
def minecraftDep = minecraftRanges[mcVersion] ?: "=${mcVersion}"
def obfuscated = mcVersion.startsWith('1.')
def javaVersion = mcVersion == '1.20.1' ? 17 : obfuscated ? 21 : 25

// Optional integrations. Jade, WTHIT, and Mod Menu are compile-only; JourneyMap compiles against src/stubs.
// Xaero's Minimap needs no API. -Pintegrations=jade,journeymap adds the listed mods to development runs.
def integrationVersions = [
        '1.20.1' : [jade: '11.13.3+fabric', wthit: 'fabric-8.21.1', badpackets: 'fabric-0.4.3', modmenu: '7.2.2',
                    journeymap: '1.20.1-6.0.7+fabric', xaero: 'fabric-1.20.1-26.6.0'],
        '1.21.1' : [jade: '15.10.6+fabric', wthit: 'fabric-12.10.2', badpackets: 'fabric-0.8.2', modmenu: '11.0.5',
                    journeymap: '1.21.1-6.0.9+fabric', xaero: 'fabric-1.21.1-26.6.0'],
        '1.21.11': [jade: '21.1.6+fabric', wthit: 'fabric-18.2.2', badpackets: 'fabric-0.11.2', modmenu: '17.0.1',
                    journeymap: '1.21.11-6.0.0+fabric', xaero: 'fabric-1.21.11-26.6.2'],
        '26.1.1' : [jade: '26.1.11+fabric', wthit: 'fabric-19.0.1', badpackets: 'fabric-0.12.2', modmenu: '18.0.2',
                    journeymap: '26.1-6.0.0-beta.67+fabric', xaero: 'fabric-26.1.2-26.6.2'],
        '26.1.2' : [jade: '26.1.11+fabric', wthit: 'fabric-19.0.1', badpackets: 'fabric-0.12.2', modmenu: '18.0.2',
                    journeymap: '26.1.2-6.0.10+fabric', xaero: 'fabric-26.1.2-26.6.2'],
        '26.2'   : [jade: '26.2.11+fabric', wthit: 'fabric-20.0.0', badpackets: 'fabric-0.12.2', modmenu: '20.0.3',
                    journeymap: '26.2-6.0.10+fabric', xaero: 'fabric-26.2-26.6.2'],
        '26.3'   : [jade: '26.3.5+fabric', modmenu: '21.0.0',
                    journeymap: '26.3-6.0.10+fabric', xaero: 'fabric-26.3-26.6.2'],
][mcVersion]
if (integrationVersions == null) {
    throw new GradleException("No integration versions mapped for Minecraft ${mcVersion} — add them to build.gradle")
}

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets {
    stubs {
        java.setSrcDirs([rootProject.file('src/stubs/java')])
        resources.setSrcDirs([])
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "familytree" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    loomx.applyMojangMappings()
    if (obfuscated) {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    }
    def integrationCompile = obfuscated ? 'modCompileOnly' : 'compileOnly'
    add(integrationCompile, "maven.modrinth:jade:${integrationVersions.jade}") { transitive = false }
    add(integrationCompile, "com.terraformersmc:modmenu:${integrationVersions.modmenu}") { transitive = false }
    if (integrationVersions.wthit) add(integrationCompile, "maven.modrinth:wthit:${integrationVersions.wthit}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.stubs.compileClasspath += sourceSets.main.compileClasspath
sourceSets.client.compileClasspath += sourceSets.stubs.output

sourceSets.test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

// Development runs load the listed mods from the run directory's mods folder, as a player's game would.
// Loom rejects mod jars built by a newer Loom, so they stay off the classpath.
configurations { integrationMods { transitive = false } }
(project.findProperty('integrations') ?: '').tokenize(',').each { name ->
    def coordinates = [jade: "maven.modrinth:jade:${integrationVersions.jade}",
                       wthit: integrationVersions.wthit ? "maven.modrinth:wthit:${integrationVersions.wthit}" : null,
                       modmenu: "com.terraformersmc:modmenu:${integrationVersions.modmenu}",
                       journeymap: "maven.modrinth:journeymap:${integrationVersions.journeymap}",
                       xaero: "maven.modrinth:xaeros-minimap:${integrationVersions.xaero}"][name]
    if (!['jade', 'wthit', 'modmenu', 'journeymap', 'xaero'].contains(name)) throw new GradleException("Unknown integration '${name}'")
    if (coordinates == null) logger.warn("${name} has no build for Minecraft ${mcVersion}; its development runs skip it")
    else dependencies.add('integrationMods', coordinates)
    if (name == 'wthit' && coordinates != null) dependencies.add('integrationMods', "maven.modrinth:badpackets:${integrationVersions.badpackets}")
}

// WTHIT has no build for every target. Without it, its plugin classes and plugin list stay out of the jar.
if (!integrationVersions.wthit) {
    sourceSets.main.java.exclude '**/integration/wthit/**'
    sourceSets.client.java.exclude '**/integration/wthit/**'
    processResources.exclude 'waila_plugins.json'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft', minecraftDep

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft': minecraftDep, 'java': "${javaVersion}"
    }
    filesMatching('familytree.mixins.json') {
        expand 'java': "${javaVersion}"
    }
    // 1.20.1 wolves have no variants, so the wolf variant invoker has no target. Its server also
    // forgets the client's language unless ClientLanguageMixin records it.
    if (mcVersion == '1.20.1') doLast {
        def file = new File(destinationDir, 'familytree.mixins.json')
        def config = new groovy.json.JsonSlurper().parse(file)
        if (!config.mixins.remove('WolfVariantInvoker')) throw new GradleException('WolfVariantInvoker is missing from familytree.mixins.json')
        config.mixins.add('ClientLanguageMixin')
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

// Run tests and development games on the Java release that 1.20.1 players use.
if (mcVersion == '1.20.1') {
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    tasks.withType(Test).configureEach { javaLauncher = launcher }
    tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach { javaLauncher = launcher }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// The demo is a separate development mod and never enters a release jar.
if (project.hasProperty('demo')) {
    sourceSets {
        demo {
            java.setSrcDirs([rootProject.file('src/demo/java')])
            resources.setSrcDirs([rootProject.file('src/demo/resources')])
            compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
        }
    }
    loom {
        mods { familytree_demo { sourceSet sourceSets.demo } }
        runs {
            demo {
                client()
                source sourceSets.demo
                vmArg '-Xmx2G'
                vmArg '-Djava.awt.headless=true'
                vmArg "-Dfamilytree.demo.gameplay=${project.hasProperty('gameplay')}"
                vmArg "-Dfamilytree.demo.horses=${project.hasProperty('horses')}"
                vmArg "-Dfamilytree.demo.animals=${project.hasProperty('animals')}"
                vmArg "-Dfamilytree.demo.farm=${project.hasProperty('farm')}"
                if (project.hasProperty('moddedAnimal')) vmArg "-Dfamilytree.demo.moddedAnimal=${project.property('moddedAnimal')}"
                if (project.hasProperty('moddedFood')) vmArg "-Dfamilytree.demo.moddedFood=${project.property('moddedFood')}"
                vmArg "-Dfamilytree.demo.integrationScene=${project.hasProperty('integrationScene') || project.hasProperty('integrations')}"
                vmArg "-Dfamilytree.demo.integrations=${project.findProperty('integrations') ?: ''}"
                vmArg "-Dfamilytree.demo.sendFeedback=${project.hasProperty('sendFeedback')}"
                runDir "../../build/demo-${mcVersion}"
                programArgs '--quickPlaySingleplayer', 'Family Tree demo', '--width', '1600', '--height', '1000'
                if (mcVersion == '26.3' && project.hasProperty('graphicsBackend')) programArgs '--graphicsBackend', project.property('graphicsBackend')
            }
        }
    }
    def syncIntegrationMods = tasks.register('syncDemoMods', Sync) {
        from configurations.integrationMods
        into rootProject.file("build/demo-${mcVersion}/mods")
    }
    tasks.named('runDemo') {
        dependsOn syncIntegrationMods
        def result = rootProject.file("build/demo-${mcVersion}/demo-result.txt")
        doFirst { result.delete() }
        doLast {
            if (!result.exists() || !result.text.startsWith('PASS:'))
                throw new GradleException(result.exists() ? result.text : 'Client demo did not report a result')
        }
    }
}
