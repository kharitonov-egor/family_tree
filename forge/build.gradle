plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def mcVersion = project.findProperty('minecraft') ?: '1.20.1'
def forgeVersions = ['1.20.1': '47.4.28']
// Packs often stay on older 47.x builds. Raise this only after testing the release jar on the new minimum.
def forgeMinimums = ['1.20.1': '47.1.0']
if (!forgeVersions.containsKey(mcVersion)) throw new GradleException("Unsupported Minecraft version ${mcVersion}")
// Optional integrations stay compile-only. -Pintegrations=jade,journeymap adds the listed mods to development runs.
def integrationVersions = [
        '1.20.1': [jade: '11.13.3+forge', wthit: 'forge-8.21.1', badpackets: 'forge-0.4.3', journeymap: '1.20.1-6.0.7+forge', xaero: 'forge-1.20.1-26.6.0'],
][mcVersion]
version = "${sharedProperties.mod_version}+${mcVersion}-forge"
layout.buildDirectory = file("build/${mcVersion}")
group = sharedProperties.maven_group
base.archivesName = 'familytree'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
// JDK 17 javac otherwise reads source in the platform encoding, which is CP1252 on Windows.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

legacyForge {
    version = "${mcVersion}-${forgeVersions[mcVersion]}"
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        familytree { sourceSet(sourceSets.main) }
    }
}

mixin {
    add sourceSets.main, 'familytree.refmap.json'
    config 'familytree.mixins.json'
}

def generated = "../versions/${mcVersion}/build/generated/stonecutter"
sourceSets {
    stubs {
        java.setSrcDirs(['../src/stubs/java'])
        resources.setSrcDirs([])
    }
}
sourceSets.main {
    java.setSrcDirs(["${generated}/main/java", "${generated}/client/java", 'src/main/java'])
    java.exclude '**/fabric/**'
    resources.setSrcDirs(['../src/main/resources', 'src/main/resources'])
    resources.exclude 'fabric.mod.json'
    compileClasspath += sourceSets.stubs.output
}
sourceSets.test {
    java.setSrcDirs(["${generated}/test/java"])
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}
sourceSets.stubs.compileClasspath = configurations.compileClasspath
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modCompileOnly("maven.modrinth:jade:${integrationVersions.jade}") { transitive = false }
    modCompileOnly("maven.modrinth:wthit:${integrationVersions.wthit}") { transitive = false }
    (project.findProperty('integrations') ?: '').tokenize(',').each { name ->
        def coordinates = [jade: "maven.modrinth:jade:${integrationVersions.jade}",
                           wthit: "maven.modrinth:wthit:${integrationVersions.wthit}",
                           journeymap: "maven.modrinth:journeymap:${integrationVersions.journeymap}",
                           xaero: "maven.modrinth:xaeros-minimap:${integrationVersions.xaero}"][name]
        if (coordinates == null) throw new GradleException("Unknown integration '${name}'")
        modRuntimeOnly(coordinates) { transitive = false }
        if (name == 'wthit') modRuntimeOnly("maven.modrinth:badpackets:${integrationVersions.badpackets}") { transitive = false }
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Forge already runs ASM. The breeding tests read Minecraft's own horse rules with it.
    testCompileOnly 'org.ow2.asm:asm-tree:9.9.1'
}
test { useJUnitPlatform() }

tasks.register('prepareSharedSources', Exec) {
    onlyIf { !project.hasProperty('sharedSourcesReady') }
    workingDir '..'
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def wrapper = file(windows ? '../gradlew.bat' : '../gradlew')
    def arguments = [wrapper.absolutePath, ":${mcVersion}:stonecutterGenerate", ":${mcVersion}:stonecutterGenerateClient",
            ":${mcVersion}:stonecutterGenerateTest", '--console=plain']
    commandLine(windows ? ['cmd', '/c'] + arguments : arguments)
}
compileJava.dependsOn 'prepareSharedSources'
compileTestJava.dependsOn 'prepareSharedSources'
sourcesJar.dependsOn 'prepareSharedSources'
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft: mcVersion, forge: forgeMinimums[mcVersion]
    }
    filesMatching('familytree.mixins.json') { expand 'java': '17' }
    // Forge 1.20.1 runs on SRG names, so mixins need the refmap. Its wolves also have no variants to invoke,
    // and its server forgets the client's language unless ClientLanguageMixin records it.
    doLast {
        def file = new File(destinationDir, 'familytree.mixins.json')
        def config = new groovy.json.JsonSlurper().parse(file)
        if (!config.mixins.remove('WolfVariantInvoker')) throw new GradleException('WolfVariantInvoker is missing from familytree.mixins.json')
        config.mixins.add('ClientLanguageMixin')
        config.refmap = 'familytree.refmap.json'
        config.minVersion = '0.8'
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

jar {
    manifest.attributes('MixinConfigs': 'familytree.mixins.json')
    from('../LICENSE') { rename { "LICENSE_familytree" } }
}

if (project.hasProperty('demo')) {
    sourceSets {
        demo {
            java.setSrcDirs(['../src/demo/java', 'src/demo/java'])
            java.exclude '**/FabricDemoClient.java'
            resources.setSrcDirs(['src/demo/resources'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    legacyForge {
        mods { familytree_demo { sourceSet(sourceSets.demo) } }
        runs {
            demo {
                client()
                sourceSet = sourceSets.demo
                jvmArgument '-Xmx2G'
                gameDirectory = file("../build/demo-forge-${mcVersion}")
                programArguments.addAll '--quickPlaySingleplayer', 'Family Tree demo', '--width', '1600', '--height', '1000'
                systemProperty 'familytree.demo.gameplay', project.hasProperty('gameplay').toString()
                systemProperty 'familytree.demo.horses', project.hasProperty('horses').toString()
                systemProperty 'familytree.demo.planner', project.hasProperty('planner').toString()
                systemProperty 'familytree.demo.animals', project.hasProperty('animals').toString()
                systemProperty 'familytree.demo.farm', project.hasProperty('farm').toString()
                systemProperty 'familytree.demo.media', project.hasProperty('media').toString()
                if (project.hasProperty('moddedAnimal')) systemProperty 'familytree.demo.moddedAnimal', project.property('moddedAnimal').toString()
                if (project.hasProperty('moddedFood')) systemProperty 'familytree.demo.moddedFood', project.property('moddedFood').toString()
                systemProperty 'familytree.demo.integrationScene', (project.hasProperty('integrationScene') || project.hasProperty('integrations')).toString()
                systemProperty 'familytree.demo.integrations', (project.findProperty('integrations') ?: '').toString()
                systemProperty 'familytree.demo.sendFeedback', project.hasProperty('sendFeedback').toString()
            }
        }
    }
    tasks.named('runDemo') {
        def result = file("../build/demo-forge-${mcVersion}/demo-result.txt")
        doFirst { result.delete() }
        doLast {
            if (!result.exists() || !result.text.startsWith('PASS:'))
                throw new GradleException(result.exists() ? result.text : 'Client demo did not report a result')
        }
    }
}

if (project.hasProperty('smoke')) {
    sourceSets {
        smoke {
            java.setSrcDirs(['../src/smoke/java', 'src/smoke/java'])
            java.exclude '**/FabricSmoke.java'
            resources.setSrcDirs(['src/smoke/resources'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    legacyForge {
        mods { familytree_smoke { sourceSet(sourceSets.smoke) } }
        runs {
            smoke {
                server()
                sourceSet = sourceSets.smoke
                gameDirectory = file("../build/smoke-forge-${mcVersion}")
                programArgument '--nogui'
                systemProperty 'familytree.smoke.minimumHistory', project.findProperty('smokeHistory') ?: '0'
            }
        }
    }
    tasks.named('runSmoke') {
        def result = file("../build/smoke-forge-${mcVersion}/smoke-result.txt")
        doFirst { result.delete() }
        doLast {
            if (!result.exists() || !result.text.startsWith('PASS:'))
                throw new GradleException(result.exists() ? result.text : 'Smoke test did not report a result')
        }
    }
}
